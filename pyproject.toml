[project]
name = "konsol-cli"
version = "0.10.0"
description = "CLI client for configuring the konsol Frappe app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
konsol = "konsol_cli.main:run"
konsol-mcp = "konsol_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konsol_cli", "src/konsol_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
mcp = [
    "mcp>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]